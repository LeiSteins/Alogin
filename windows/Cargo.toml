[package]
name = "alogin-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"
description = "Alogin Windows native campus network client"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp", "Win32_Networking_WinSock",
    "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
