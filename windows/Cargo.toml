[package]
name = "alogin-windows"
version = "0.0.2"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0"
description = "Alogin Windows native campus network client"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06", "compat-1-18", "unstable-winit-030"] }
# Version-matched access for the Windows repaint fix in src/ui/repaint.rs.
i-slint-core = { version = "=1.18.1", default-features = false }
raw-window-handle = "0.6"
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp", "Win32_Networking_WinSock",
    "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
slint-build = "=1.18.1"

[dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_Xps"] }
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
